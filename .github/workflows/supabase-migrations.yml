# Applies new database migrations (supabase/migrations/*.sql) and the auth
# settings in supabase/config.toml to the Supabase project whenever they
# reach the main branch. Already-applied migrations are
# skipped, so it is safe to run again. Can also be started by hand from the
# GitHub Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   optional: the database password (otherwise a temporary login role is used)
#
# The project is shared with CivilEng Portfolio, which keeps its own
# migrations (pf_*) in its own repository. Both write to the same migration
# history, so before pushing, this workflow adds empty placeholder files for
# versions that exist only on the database. They are already applied there, so
# `db push` skips them instead of refusing to run.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/config.toml', '.github/workflows/supabase-migrations.yml']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: iealljnqewqyojtlgheh
    steps:
      - uses: actions/checkout@v5

      - name: Check that the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          # Without SUPABASE_DB_PASSWORD the CLI connects with a short-lived login role.
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::notice::SUPABASE_DB_PASSWORD not set; using a temporary login role."; fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link the Supabase project
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase link --project-ref "$PROJECT_REF"

      - name: Add placeholders for migrations applied by other CivilEng apps
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase migration list --linked | tee migrations.txt
          # Rows with an empty "Local" column and a version in "Remote".
          # The CLI wraps values in backticks, e.g. "` `" for an empty cell.
          awk -F'|' '{ l=$1; r=$2; gsub(/[ \t`]/, "", l); gsub(/[ \t`]/, "", r); if (l == "" && r ~ /^[0-9]+$/) print r }' migrations.txt |
            while read -r version; do
              echo "Remote-only migration $version (another CivilEng app): adding a placeholder"
              echo "-- Applied by another CivilEng app; placeholder so db push accepts the shared history." \
                > "supabase/migrations/${version}_applied_elsewhere.sql"
            done

      - name: Apply new migrations
        # --include-all: a new ResearchHub migration may be older than one
        # CivilEng Portfolio has applied since; it still needs to run.
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase db push --linked --include-all

      - name: Apply auth settings (site URL, password rules, email confirmation)
        # The diff printed above is the change being approved; config.toml is reviewed in Git.
        env:
          SUPABASE_YES: "1"
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase config push --project-ref "$PROJECT_REF"

      - name: Show migration status
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase migration list --linked
