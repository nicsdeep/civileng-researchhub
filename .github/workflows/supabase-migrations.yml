# Applies new database migrations (supabase/migrations/*.sql) to the Supabase
# project whenever they reach the main branch. Already-applied migrations are
# skipped, so it is safe to run again. Can also be started by hand from the
# GitHub Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the project's database password
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: iealljnqewqyojtlgheh
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link the Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply new migrations
        run: supabase db push

      - name: Show migration status
        run: supabase migration list
