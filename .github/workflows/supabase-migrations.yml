# Applies new database migrations (supabase/migrations/*.sql) to the Supabase
# project whenever they reach the main branch. Already-applied migrations are
# skipped, so it is safe to run again. Can also be started by hand from the
# GitHub Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   optional: the database password (otherwise a temporary login role is used)
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: iealljnqewqyojtlgheh
    steps:
      - uses: actions/checkout@v5

      - name: Check that the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          # Without SUPABASE_DB_PASSWORD the CLI connects with a short-lived login role.
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::notice::SUPABASE_DB_PASSWORD not set; using a temporary login role."; fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link the Supabase project
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase link --project-ref "$PROJECT_REF"

      - name: Apply new migrations
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase db push

      - name: Show migration status
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || unset SUPABASE_DB_PASSWORD
          supabase migration list
